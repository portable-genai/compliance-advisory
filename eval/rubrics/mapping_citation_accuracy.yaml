# Mapping-citation-accuracy rubric — A4 AI Quality & Model-Risk gate (P-08).
#
# Merged from the C2 Control-Mapping Toolkit. Named ``mapping_citation_accuracy`` (not
# ``citation_accuracy``) so it does not collide with the compliance-advisory QA citation
# metric in the shared eval table.
#
# "Mapping citation accuracy" measures whether every control mapping cites the regulatory
# source of the requirement it concerns. An evidence pack handed to an auditor is worthless
# if a mapping cannot be traced back to the obligation and its source document/page.
#
# Production scorer: the Gen AI evaluation service on the Gemini Enterprise Agent Platform
# (vertexai GenAI Client -> client.evals.evaluate), routed through
# compliance_advisory.adapters.gcp.genai_eval:GenAiEvalAdapter.
# Offline/CI scorer: the deterministic check in eval/run_eval.py — the requirement's
# source_id must appear in the ControlMapping's citations produced by the real merged
# ControlMappingService.

metric: mapping_citation_accuracy
description: >
  Fraction of mappings whose citations include the regulatory source of the mapped
  requirement (no missing or fabricated citation). Averaged over the dataset.
threshold: 0.90          # report fails if score < 0.90
direction: maximize
applies_to:
  - ControlMapping.citations

criteria:
  - id: requirement_cited
    description: The mapping cites the source_id of the requirement it maps.
    weight: 0.7
  - id: no_fabricated_citation
    description: The mapping cites only the requirement's own source, never an invented one.
    weight: 0.3

scoring:
  scale: [0.0, 1.0]
  pass_if: "score >= threshold"

notes: >
  The offline heuristic is strict: a mapping that omits the requirement's source_id scores
  0 for that example, so passing the offline gate is a lower bound on the LLM-judge score
  the production evaluator would assign.
