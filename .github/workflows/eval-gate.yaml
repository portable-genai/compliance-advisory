name: Eval gate

# The pre-merge eval SMOKE check, and NOT the promotion authority. Runs eval/run_eval.py
# --mode smoke over the golden datasets and fails (non-zero exit) if any metric, across the
# QA, horizon and mapping families, is below threshold. That is a merge decision, not a
# release one. The promotion VERDICT is Hrz4's, taken separately at release time with
# --mode gate, which run_eval.py refuses outside the platform or gcp profile and which this
# offline job therefore cannot produce. Workflow name kept stable for branch protection.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # The eval gate runs deterministically on the onprem profile by default (fakes),
  # so the gate itself needs no cloud credentials. Switch to gcp in a protected
  # environment to score against the live Gen AI evaluation service.
  COMPLIANCE_PROFILE: onprem

jobs:
  eval:
    name: eval smoke check (pre-merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock && pip install -e . --no-deps

      - name: Run eval smoke check
        # Non-zero exit fails the pre-merge check. The authoritative promotion verdict is
        # Hrz4's, taken with --mode gate outside this workflow.
        run: python eval/run_eval.py --mode smoke
