name: Corpus refresh

# Scheduled refresh of the 7-day fetch-at-runtime regulatory corpus (P-11).
#
# This workflow documents and drives the OUT-OF-BAND freshness job: it asks the
# AlloyDB ledger (CorpusLedgerPort.list_expired) which sources are expiring, re-fetches
# them from the source registry, and re-ingests them into Agent Search — so most
# inline reads hit fresh data and never pay the fetch latency. (The inline path also
# re-fetches a stale source on demand before answering; this job keeps that rare.)
#
# Cron runs daily; the TTL is 7 days (corpus.ttl_days), so a daily refresh keeps every
# source comfortably inside its freshness window. It also supports manual dispatch.

on:
  schedule:
    # 18:00 UTC = 02:00 Singapore (SGT, UTC+8). Daily, off-peak.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      source_id:
        description: "Refresh only this source id (blank = all expiring sources)."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Never run two refreshes at once — they write the same ledger rows.
  group: corpus-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh expiring regulatory sources
    # Skipped unless the repo opts in (vars.ENABLE_CORPUS_REFRESH = true) and provides GCP
    # credentials. A public repo has no Application Default Credentials, so an ungated cron
    # fails nightly; enable this on the deployment that has Workload Identity configured.
    if: ${{ vars.ENABLE_CORPUS_REFRESH == 'true' }}
    runs-on: ubuntu-latest
    # The real refresh targets the managed stack (Agent Search + AlloyDB) in
    # asia-southeast1 and therefore needs Workload Identity Federation to a SG project.
    # Configure this environment with the federated credentials before enabling on a fork.
    environment: corpus-refresh
    env:
      COMPLIANCE_PROFILE: gcp
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      COMPLIANCE_ALLOYDB_URI: ${{ vars.COMPLIANCE_ALLOYDB_URI }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (managed stack)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gcp]"

      # Authenticate via Workload Identity Federation (no long-lived keys).
      # Uncomment and configure once the SG project + WIF pool exist.
      # - name: Authenticate to Google Cloud
      #   uses: google-github-actions/auth@v2
      #   with:
      #     workload_identity_provider: ${{ vars.WIF_PROVIDER }}
      #     service_account: ${{ vars.REFRESH_SERVICE_ACCOUNT }}

      - name: Refresh expiring sources
        # Drives the pipeline: list_expired -> fetch -> ingest -> upsert(expires_at = now + ttl).
        # SOURCE_ID empty refreshes everything past its TTL.
        env:
          SOURCE_ID: ${{ github.event.inputs.source_id }}
        run: |
          compliance corpus refresh ${SOURCE_ID:+--source-id "$SOURCE_ID"}
